  <img src="logo.png" width="100">

</div>


<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-black bg-opacity-75">
  <div class="container">
    <a class="navbar-brand fw-bold fs-3" href="index.html">BAOKITM</a>

<!-- Contact Section -->
<div class="container py-5 text-white">

  <h2 class="text-center mb-4">Contact Us</h2>

  <div class="row">

    <!-- Form -->
    <div class="col-md-6 mb-4">
      <div class="card bg-dark text-white p-4">
        <h4>Send a Message</h4>

        <form>
          <input type="text" class="form-control mb-3" placeholder="Full Name">
          <input type="email" class="form-control mb-3" placeholder="Email">
          <textarea class="form-control mb-3" rows="4" placeholder="Message"></textarea>
          <button class="btn btn-danger w-100">Send Message</button>
        </form>
      </div>
    </div>

    <!-- Info -->
    <div class="col-md-6 mb-4">
      <div class="card bg-dark text-white p-4">
        <h4>Our Location</h4>
        <p>Gabane, Botswana</p>

        <h5 class="mt-3">Opening Hours</h5>
        <ul class="list-unstyled">
          <li>Mon–Fri: 08:00 – 17:00</li>
          <li>Saturday: 09:00 – 14:00</li>
          <li>Sunday: Closed</li>
        </ul>
      </div>
    </div>

  </div>
